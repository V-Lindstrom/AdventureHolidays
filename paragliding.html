<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragliding</title>
    
    <!-- Stylesheets for layout and design -->
    <link rel="stylesheet" href="css/paragliding.css">
    <link rel="stylesheet" href="css/_navigation.css">
    <link rel="stylesheet" href="css/_headerfooter.css">

    <link rel="icon" type="image/x-icon" href="Images/Logo.svg">  <!-- Favicon for the website -->

    
    <script src="js/paragliding.js"></script> <!-- JS used for dynamic info loading -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="Images/Logo.svg" alt="Adventure Holidays Logo">
        </div>
        <h1>Adventure Holidays</h1>
    </header>

    <main>
        <!-- Active class marks current page -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Walking.html">Walking</a></li>
                <li><a href="LakeFishing.html">Lake Fishing</a></li>
                <li><a href="paragliding.html" class="active">Paragliding</a></li>
                <li><a href="RockClimbing.html">Rock climbing</a></li>
            </ul>
        </nav>
        
        <div class="content">

            <div class="info-box" id="info-container">
                
                <h2>Paragliding Adventures</h2>
                <p>Loading information...</p>
            </div>

            <!-- Image is centered-ish between info and itinerary -->
            <img src="images/paraglidng.jpg" alt="Paragliding over mountain landscape" class="img">

            <div class="itinerary" id="itinerary-container">
                <h2>Itinerary</h2>
                <div id="itinerary-content">Loading itinerary...</div>
            </div>  

            <div class="booking-option">
                <h2>Book Your Paragliding Adventure</h2>
                <form id="booking-form">
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="people">Number of People:</label>
                        <input type="number" id="people" name="people" min="1" max="8" value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="Level">Level:</label>
                        <select id="Level" name="Level" required>
                            <option value="">Select your level</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Expert">Expert</option>
                        </select>
                    </div>

                    <button type="submit">Book Now</button>
                </form>

                <div id="availability"></div>
            </div>
        </div>
    </main>

    <footer>
        &copy; Adventure Holidays 2025
    </footer>
</body>
</html>
